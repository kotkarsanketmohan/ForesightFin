<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Income | ForesightFin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container mt-4">

    <h3 class="mb-3">Add Income</h3>

    <!-- FORM -->
    <form th:action="@{/income/add}"
          th:object="${income}"
          method="post"
          class="card p-3 mb-4">

        <input type="text"
               th:field="*{source}"
               class="form-control mb-2"
               placeholder="Income Source"
               required>

        <input type="number"
               th:field="*{amount}"
               step="0.01"
               min="0"
               class="form-control mb-2"
               placeholder="Amount"
               required>

        <input type="date"
               th:field="*{date}"
               class="form-control mb-3"
               required>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                Add Income
            </button>
            <a href="/dashboard" class="btn btn-secondary">
                Back to Dashboard
            </a>
        </div>
    </form>

    <!-- TABLE -->
    <h4>Your Income Records</h4>

    <table class="table table-bordered table-striped mt-3">
        <thead style="background-color:#198754;color:white;">
        <tr>
            <th>Source</th>
            <th>Amount</th>
            <th>Date</th>
            <th style="width:120px;">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${#lists.isEmpty(incomeList)}">
            <td colspan="4" class="text-center text-muted">
                No income records added yet
            </td>
        </tr>

        <tr th:each="i : ${incomeList}">
            <td th:text="${i.source}"></td>
            <td th:text="${i.amount}"></td>
            <td th:text="${i.date}"></td>
            <td>
                <a th:href="@{/income/delete/{id}(id=${i.id})}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
