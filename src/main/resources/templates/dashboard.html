<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | ForesightFin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container mt-5">
    <h3 class="text-center mb-4">
        Welcome, <span th:text="${username}"></span> 👋
    </h3>
    <h3 class="text-center mb-4">Financial Dashboard</h3>

    <div class="row g-4">
        <div class="col-md-4">
            <a href="/income" class="btn btn-primary w-100 dashboard-btn">Add Income</a>
        </div>
        <div class="col-md-4">
            <a href="/expense" class="btn btn-warning w-100 dashboard-btn">Add Expense</a>
        </div>
        <div class="col-md-4">
            <a href="/goal" class="btn btn-success w-100 dashboard-btn">Financial Goals</a>
        </div>
    </div>

    <div class="text-center page-footer">
        <a href="/" class="btn btn-outline-danger">Logout</a>
    </div>
</div>

</body>
</html>
