<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Financial Goals | ForesightFin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container mt-4">

    <h3 class="mb-3">Financial Goals</h3>

    <form th:action="@{/goal/save}"
          th:object="${goal}"
          method="post"
          class="card p-3 mb-4">

        <input th:field="*{goalName}"
               class="form-control mb-2"
               placeholder="Goal Name (e.g. Buy Laptop)"
               required />

        <input th:field="*{targetAmount}"
               type="number"
               step="0.01"
               min="0"
               class="form-control mb-2"
               placeholder="Target Amount"
               required />

        <input th:field="*{targetDate}"
               type="date"
               class="form-control mb-2"
               required />

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                Add Goal
            </button>
            <a href="/dashboard" class="btn btn-secondary">
                Back to Dashboard
            </a>
        </div>
    </form>

    <h4>Your Financial Goals</h4>

    <table class="table table-bordered table-striped mt-3">
        <thead style="background-color:#f1f1f1; color:black;">        <tr>
            <th>Goal</th>
            <th>Target Amount</th>
            <th>Target Date</th>
            <th style="width:120px;">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${#lists.isEmpty(goalList)}">
            <td colspan="4" class="text-center text-muted">
                No financial goals added yet
            </td>
        </tr>

        <tr th:each="g : ${goalList}">
            <td th:text="${g.goalName}"></td>
            <td th:text="${g.targetAmount}"></td>
            <td th:text="${g.targetDate}"></td>
            <td>
                <a th:href="@{/goal/delete/{id}(id=${g.id})}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
