<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Expense | ForesightFin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container mt-4">

    <h3 class="mb-3">Add Expense</h3>

    <form th:action="@{/expense/save}"
          th:object="${expense}"
          method="post"
          class="card p-3 mb-4">

        <input th:field="*{amount}"
               type="number"
               step="0.01"
               min="0"
               class="form-control mb-2"
               placeholder="Expense Amount"
               required />

        <input th:field="*{category}"
               class="form-control mb-2"
               placeholder="Category"
               required />

        <input th:field="*{date}"
               type="date"
               class="form-control mb-3"
               required />

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning">
                Add Expense
            </button>
            <a href="/dashboard" class="btn btn-secondary">
                Back to Dashboard
            </a>
        </div>
    </form>

    <h4>Your Expense Records</h4>

    <table class="table table-bordered table-striped mt-3">
        <thead style="background-color:#f1f1f1; color:black;">
        <tr>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th style="width:120px;">Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:if="${#lists.isEmpty(expenseList)}">
            <td colspan="4" class="text-center text-muted">
                No expenses recorded yet
            </td>
        </tr>

        <tr th:each="e : ${expenseList}">
            <td th:text="${e.amount}"></td>
            <td th:text="${e.category}"></td>
            <td th:text="${e.date}"></td>
            <td>
                <a th:href="@{/expense/delete/{id}(id=${e.id})}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
